; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:esp32dev]
;platform = espressif32
;board = esp32dev
;framework = arduino
;monitor_speed = 115200
;upload_port = COM12

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Enable SPIFFS filesystem
board_build.filesystem = spiffs

; Monitor settings
monitor_speed = 115200
monitor_dtr = 0          ; Required for some USB-serial chips

; Upload settings
upload_speed = 921600    ; Faster upload
upload_protocol = esptool

; Partition scheme (allocate 1.5MB for SPIFFS, adjust as needed)
board_build.partitions = default_8MB.csv  ; Or use custom partition

; Build flags (optional)
build_flags = 
    -DCORE_DEBUG_LEVEL=1  ; Enable debug output

; Library dependencies (if needed)
lib_deps = 
    ; Add any libraries here